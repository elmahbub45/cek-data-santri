<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cek Data Santri</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 16px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      margin: 0;
      color: #666;
      line-height: 1.6;
    }

    .status {
      margin-top: 25px;
      padding: 14px;
      border-radius: 10px;
      background: #f0fdf4;
      color: #166534;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Cek Data Santri</h1>

    <p>
      Sistem pengecekan data santri
    </p>

    <div class="status">
      Frontend PWA berhasil dimuat.
    </div>

  </main>

</body>
</html>
